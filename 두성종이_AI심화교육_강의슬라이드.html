<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>두성종이 AI 업무활용 심화교육(2차) — 강의 슬라이드</title>
<style>
:root{
  --ink:#16202c; --navy:#1f3a5f; --blue:#2f6fb5; --muted:#6b7785; --line:#dfe4ea;
  --paper:#ffffff; --stage:#e6eaf0; --soft:#f4f6f9; --brand:#c0653f;
  --ok:#2f7a4f; --okbg:#edf6f0; --warn:#9a6b12; --warnbg:#fdf5e3;
  --dan:#b03a2e; --danbg:#fdeeec; --info:#2b5f96; --infobg:#eef4fb;
  --hand:#a0522d; --handbg:#fdf1e9;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);
  font-family:"Pretendard","Malgun Gothic","맑은 고딕",-apple-system,"Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden}

/* ---------- stage & slide ---------- */
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#track{width:1280px;height:720px;position:relative;transform-origin:center center}
.slide{position:absolute;inset:0;background:var(--paper);border-radius:6px;
  box-shadow:0 18px 50px rgba(20,32,48,.22);padding:44px 62px 58px;display:none;
  flex-direction:column;overflow:hidden}
.slide.on{display:flex}
.slide.cover,.slide.section,.slide.end{justify-content:center}

/* ---------- slide chrome ---------- */
.kick{font-size:14px;font-weight:700;color:var(--blue);letter-spacing:.2px;
  display:flex;align-items:center;gap:9px;margin-bottom:8px}
.kick::before{content:"";width:20px;height:3px;background:var(--blue);border-radius:2px;flex:none}
.kick .tm{margin-left:auto;font-weight:600;color:var(--muted);font-size:12.5px;
  background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px 11px}
h1.t{font-size:32px;line-height:1.28;margin:0 0 15px;letter-spacing:-.6px;color:var(--navy);font-weight:800}
h1.t small{display:block;font-size:15.5px;font-weight:600;color:var(--muted);margin-top:7px;letter-spacing:0}
.body{flex:1;min-height:0;font-size:16px;line-height:1.62;overflow:hidden;display:flex;flex-direction:column}
.body.mid{justify-content:center}
.bin{transform-origin:top left;flex:none;width:100%}

/* ---------- footer with logo + copyright ---------- */
.foot{position:absolute;left:62px;right:62px;bottom:18px;display:flex;justify-content:space-between;
  align-items:center;font-size:11.5px;color:#9aa4b0;border-top:1px solid var(--line);padding-top:9px;gap:14px}
.foot .fl{display:flex;align-items:center;gap:10px;min-width:0}
.foot .fl img{height:15px;width:auto;display:block;flex:none}
.foot .fl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot b{color:var(--navy);font-weight:700}
.foot .fr{display:flex;align-items:center;gap:12px;white-space:nowrap;flex:none}
.foot .cr{color:#aab3bd}
.foot .pgno{color:var(--navy);font-weight:700}

/* ---------- typography bits ---------- */
.lead{font-size:18px;line-height:1.6;color:#2c3a4b;margin:0 0 16px}
.lead b,.body b{color:var(--navy);font-weight:700}
.body p{margin:0 0 11px}
.q{font-size:21px;font-weight:800;color:var(--navy);line-height:1.45;
  border-left:5px solid var(--blue);padding:6px 0 6px 18px;margin:13px 0}
.q.sm{font-size:18px}
.small{font-size:13.5px;color:var(--muted)}
.mono{font-family:"D2Coding","Consolas","Menlo",monospace}
ul.b,ol.b{margin:0 0 11px;padding-left:22px}
ul.b li,ol.b li{margin:0 0 8px}
ul.b{list-style:none;padding-left:0}
ul.b>li{position:relative;padding-left:19px}
ul.b>li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;
  border-radius:50%;background:var(--blue)}
ul.chk{list-style:none;padding-left:0;margin:0 0 11px}
ul.chk>li{position:relative;padding-left:26px;margin-bottom:8px}
ul.chk>li::before{content:"☐";position:absolute;left:0;top:-1px;font-size:16px;color:var(--blue);font-weight:700}

/* ---------- callouts ---------- */
.cal{border-radius:9px;padding:13px 17px 13px 16px;margin:11px 0;font-size:15.5px;line-height:1.56;
  border-left:5px solid var(--blue);background:var(--infobg);color:#22344a}
.cal .ch{font-weight:800;display:block;margin-bottom:4px}
.cal.ok{border-color:var(--ok);background:var(--okbg)} .cal.ok .ch{color:var(--ok)}
.cal.warn{border-color:#d9a441;background:var(--warnbg)} .cal.warn .ch{color:var(--warn)}
.cal.dan{border-color:#d1584a;background:var(--danbg)} .cal.dan .ch{color:var(--dan)}
.cal.hand{border-color:#d08a55;background:var(--handbg)} .cal.hand .ch{color:var(--hand)}
.cal.info .ch{color:var(--info)}
.cal.gray{border-color:#b9c2cd;background:var(--soft);color:#3a4756} .cal.gray .ch{color:var(--navy)}
.cal.sm{font-size:14px;padding:11px 15px}

/* ---------- grids & cards ---------- */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{border:1px solid var(--line);border-radius:9px;padding:14px 16px;background:#fff}
.card.fill{background:var(--soft)}
.card h4{margin:0 0 8px;font-size:15.5px;color:var(--navy);font-weight:800}
.card ul.b li{margin-bottom:6px;font-size:14.5px}
.card.no{border-color:#e8c4bf;background:#fdf4f2} .card.no h4{color:var(--dan)}
.card.yes{border-color:#bcdcc7;background:#f1f8f3} .card.yes h4{color:var(--ok)}

/* ---------- stat tiles ---------- */
.kpi{border:1px solid var(--line);border-radius:9px;padding:12px 14px;background:#fff}
.kpi .n{font-size:27px;font-weight:800;color:var(--navy);line-height:1.1;letter-spacing:-1px}
.kpi .n em{font-style:normal;font-size:15px;font-weight:700;color:var(--muted);margin-left:3px}
.kpi .l{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.45}
.kpi.red .n{color:var(--dan)} .kpi.amber .n{color:#b9832a} .kpi.green .n{color:var(--ok)}

/* ---------- tables ---------- */
table.tb{width:100%;border-collapse:collapse;font-size:14.5px;margin:5px 0 11px}
table.tb th{background:var(--navy);color:#fff;font-weight:700;font-size:13px;padding:9px 11px;text-align:left;
  border:1px solid var(--navy)}
table.tb td{border:1px solid var(--line);padding:8px 11px;vertical-align:top;line-height:1.5}
table.tb tr:nth-child(even) td{background:#fafbfc}
table.tb td b{color:var(--navy)}
table.tb.sm{font-size:13.2px} table.tb.sm th{font-size:12px;padding:7px 9px} table.tb.sm td{padding:7px 9px}
table.tb.xs{font-size:12.4px} table.tb.xs th{font-size:11.5px;padding:6px 8px} table.tb.xs td{padding:6px 8px}
table.tb .c{text-align:center}
table.tb .hl td{background:#fdf5e3!important}
table.tb td.hl{background:#fdf5e3!important}

/* ---------- prompt block ---------- */
.pw{position:relative;margin:9px 0 11px}
.pw .cp{position:absolute;top:8px;right:8px;border:1px solid #46586d;background:#2b3b4e;color:#e8eef5;
  font:600 11.5px/1 inherit;padding:6px 11px;border-radius:5px;cursor:pointer;letter-spacing:.2px}
.pw .cp:hover{background:#3a4d63}
.pw .cp.done{background:var(--ok);border-color:var(--ok)}
pre.prompt{margin:0;background:#1f2b38;color:#dce6f1;border-radius:8px;padding:14px 16px;
  font-family:"D2Coding","Consolas","Menlo",monospace;font-size:13px;line-height:1.55;
  white-space:pre-wrap;word-break:break-word}
pre.prompt.sm{font-size:12px;line-height:1.5}
pre.prompt .h{color:#7fc4ff;font-weight:700}
pre.prompt .v{color:#ffd17a}
pre.prompt .k{color:#9fe0a8}

/* ---------- diagram / flow ---------- */
pre.dia{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:13px 15px;
  font-family:"D2Coding","Consolas","Menlo",monospace;font-size:12.5px;line-height:1.5;margin:8px 0 11px;
  white-space:pre;color:#2c3a4b}
.flow{display:flex;align-items:stretch;gap:7px;margin:12px 0}
.flow .fs{flex:1;border:1px solid var(--line);border-radius:9px;padding:11px 9px;text-align:center;background:#fff}
.flow .fs .t1{font-size:14.5px;font-weight:800;color:var(--navy)}
.flow .fs .t2{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4}
.flow .ar{align-self:center;color:#9aa4b0;font-size:16px;font-weight:700}

/* ---------- chips ---------- */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 12px}
.chip{font-size:12.5px;font-weight:700;border-radius:999px;padding:5px 12px;background:var(--soft);
  color:var(--navy);border:1px solid var(--line)}
.chip.hand{background:var(--handbg);color:var(--hand);border-color:#eccfb8}
.chip.ai{background:var(--infobg);color:var(--info);border-color:#cfe0f2}
.chip.team{background:var(--okbg);color:var(--ok);border-color:#c3e0cd}
.chip.out{background:#efe9fb;color:#5b4396;border-color:#d9cff2}

/* ---------- done bar ---------- */
.done{margin-top:auto;border:1px solid #bcdcc7;background:var(--okbg);border-radius:9px;
  padding:11px 16px;font-size:15px;line-height:1.55;color:#23503a;display:flex;gap:11px;align-items:flex-start}
.done .i{font-weight:800;color:var(--ok);flex:none}
.done b{color:#1c4632}

/* ---------- cover / section / end ---------- */
.cover{background:linear-gradient(150deg,#1f3a5f 0%,#2a5a8f 62%,#347bb5 100%);color:#fff;
  padding:0 78px;justify-content:center}
.cover .clogo{height:38px;width:auto;margin-bottom:30px;display:block;align-self:flex-start;flex:none}
.cover .cv1{font-size:13px;letter-spacing:3px;font-weight:700;opacity:.78;margin-bottom:14px}
.cover h1{font-size:48px;line-height:1.2;margin:0 0 13px;font-weight:800;letter-spacing:-1.5px}
.cover .cv2{font-size:20px;opacity:.92;font-weight:500;margin-bottom:30px;line-height:1.5}
.cover .cvm{display:flex;gap:34px;font-size:14px;opacity:.9;border-top:1px solid rgba(255,255,255,.28);padding-top:18px}
.cover .cvm b{display:block;font-size:11.5px;opacity:.72;font-weight:600;margin-bottom:4px;letter-spacing:.5px}

.section{background:var(--navy);color:#fff;padding:0 78px}
.section .sn{font-size:74px;font-weight:800;opacity:.22;line-height:1;letter-spacing:-3px;margin-bottom:4px}
.section h1{font-size:39px;margin:0 0 11px;font-weight:800;letter-spacing:-1.2px;line-height:1.22}
.section .ss{font-size:17.5px;opacity:.88;line-height:1.55;max-width:880px;margin-bottom:22px}
.section .sg{display:flex;gap:9px;flex-wrap:wrap}
.section .sg span{border:1px solid rgba(255,255,255,.32);border-radius:999px;padding:6px 14px;font-size:13.5px;
  background:rgba(255,255,255,.08)}
.section .slogo{position:absolute;top:44px;right:62px;height:22px;width:auto;opacity:.5}

.end{background:linear-gradient(150deg,#1f3a5f 0%,#2a5a8f 100%);color:#fff;padding:0 78px}
.end .clogo{height:32px;width:auto;margin-bottom:26px;display:block;align-self:flex-start;flex:none}
.end h1{font-size:40px;margin:0 0 16px;font-weight:800;letter-spacing:-1.2px}
.end .el{font-size:19px;line-height:1.62;opacity:.94;max-width:900px}
.end .ec{margin-top:26px;font-size:14.5px;opacity:.85;border-top:1px solid rgba(255,255,255,.26);padding-top:16px}

.cover .foot,.section .foot,.end .foot{border-top-color:rgba(255,255,255,.2);color:rgba(255,255,255,.62)}
.cover .foot b,.section .foot b,.end .foot b{color:#fff}
.cover .foot .cr,.section .foot .cr,.end .foot .cr{color:rgba(255,255,255,.55)}
.cover .foot .pgno,.section .foot .pgno,.end .foot .pgno{color:#fff}
.cover .foot{left:78px;right:78px} .section .foot{left:78px;right:78px} .end .foot{left:78px;right:78px}

/* ---------- UI chrome ---------- */
#bar{position:fixed;top:0;left:0;height:3px;background:var(--blue);z-index:40;transition:width .18s ease}
#ui{position:fixed;right:16px;bottom:14px;display:flex;gap:7px;z-index:45}
#ui button{border:1px solid #c3ccd7;background:rgba(255,255,255,.94);color:var(--navy);border-radius:7px;
  font:600 12.5px/1 inherit;padding:8px 12px;cursor:pointer}
#ui button:hover{background:#fff;border-color:var(--blue)}
#pg{position:fixed;left:16px;bottom:14px;z-index:45;font-size:12.5px;color:#5b6775;
  background:rgba(255,255,255,.9);border:1px solid #c3ccd7;border-radius:7px;padding:5px 7px;font-weight:600;
  display:flex;align-items:center;gap:7px}
#pg button{border:1px solid #c3ccd7;background:#fff;color:var(--navy);border-radius:5px;width:26px;height:24px;
  font:700 15px/1 inherit;cursor:pointer;padding:0}
#pg button:hover{border-color:var(--blue);background:#f2f6fb}
/* 발표용 부가 UI */
#timer{position:fixed;top:12px;right:16px;z-index:45;display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.92);border:1px solid #c3ccd7;border-radius:8px;padding:6px 8px 6px 12px;
  font:700 13px/1 inherit;color:var(--navy)}
#timer .tv{font-variant-numeric:tabular-nums;letter-spacing:.5px;min-width:52px;text-align:center}
#timer button{border:1px solid #c3ccd7;background:#fff;color:var(--navy);border-radius:6px;
  font:600 11.5px/1 inherit;padding:6px 9px;cursor:pointer}
#timer button:hover{border-color:var(--blue)}
#timer.run .tv{color:var(--ok)}
#black{position:fixed;inset:0;background:#0b1118;z-index:70;display:none}
#black.on{display:block}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:64px;z-index:80;
  background:rgba(22,32,44,.94);color:#fff;border-radius:8px;padding:10px 18px;font-size:13.5px;
  opacity:0;transition:opacity .22s ease;pointer-events:none;font-weight:600}
#toast.on{opacity:1}
#tocq{width:100%;max-width:420px;margin:0 0 16px;border:1px solid #3a4c61;background:#16232f;color:#e9eef4;
  border-radius:7px;padding:9px 12px;font:500 13.5px/1 inherit;outline:none}
#tocq:focus{border-color:#7fc4ff}
#tocq::placeholder{color:#7d8e9f}

/* 클릭 가능한 체크 항목 */
ul.chk>li{cursor:pointer;border-radius:6px;padding-top:1px;padding-bottom:1px;transition:background .12s}
ul.chk>li:hover{background:#f2f6fb}
ul.chk>li.done::before{content:"☑";color:var(--ok)}
ul.chk>li.done{color:#7c8794;text-decoration:line-through;text-decoration-color:#c3ccd7}
td.tick{cursor:pointer;text-align:center;user-select:none}
td.tick:hover{background:#f2f6fb!important}
td.tick.done{color:var(--ok);font-weight:800}

#toc{position:fixed;inset:0;background:rgba(16,26,38,.96);z-index:60;display:none;padding:30px 44px;
  overflow:auto;color:#e9eef4}
#toc.on{display:block}
#toc .tbar{display:flex;align-items:center;gap:14px;margin-bottom:4px}
#toc .tbar img{height:20px;width:auto}
#toc h2{margin:0;font-size:20px;font-weight:800;color:#fff}
#toc .th{font-size:13px;color:#9fb2c6;margin-bottom:18px}
#toc .grp{margin-bottom:18px}
#toc .gt{font-size:12.5px;font-weight:800;color:#7fc4ff;letter-spacing:1px;margin-bottom:8px}
#toc .row{display:flex;flex-wrap:wrap;gap:6px}
#toc .it{border:1px solid #3a4c61;border-radius:6px;padding:7px 11px;font-size:13px;cursor:pointer;
  background:#1b2937;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toc .it:hover{background:#26384b;border-color:#7fc4ff}
#toc .it i{font-style:normal;color:#8ba0b6;margin-right:7px;font-size:11.5px}
#toc .close{position:absolute;top:22px;right:30px;border:1px solid #3a4c61;background:#1b2937;color:#e9eef4;
  border-radius:7px;padding:8px 13px;font:600 12.5px/1 inherit;cursor:pointer}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:44;font-size:12.5px;
  color:#5b6775;background:rgba(255,255,255,.9);border:1px solid #c3ccd7;border-radius:7px;padding:8px 14px;
  transition:opacity .4s ease}
#hint.hide{opacity:0;pointer-events:none}

/* ---------- print ---------- */
@media print{
  @page{size:A4 landscape;margin:0}
  html,body{overflow:visible;background:#fff;height:auto}
  #stage{position:static;display:block}
  #track{width:auto;height:auto;transform:none!important}
  #bar,#ui,#pg,#toc,#hint,#timer,#black,#toast{display:none!important}
  ul.chk>li{cursor:auto} ul.chk>li.done{color:inherit;text-decoration:none}
  td.tick{cursor:auto}
  .slide{position:relative;display:flex!important;inset:auto;width:297mm;height:209mm;
    border-radius:0;box-shadow:none;page-break-after:always;break-after:page;padding:14mm 17mm 17mm;overflow:hidden}
  .slide:last-child{page-break-after:auto}
  .cover,.section,.end{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.tb th,pre.prompt,.cal,.kpi,.card,.done,.chip,.kick .tm{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pw .cp{display:none}
  .foot{left:17mm;right:17mm;bottom:8mm}
  .cover .foot,.section .foot,.end .foot{left:17mm;right:17mm}
}
</style></head><body>
<div id="bar"></div>
<div id="stage"><div id="track"></div></div>
<div id="pg"><button id="bprev" title="이전 (←)">‹</button><span id="pgn">1</span> / <span id="pgt">1</span><button id="bnext" title="다음 (→)">›</button></div>
<div id="timer"><span class="tv" id="tv">00:00</span><button id="tstart">시작</button><button id="treset">리셋</button></div>
<div id="ui">
  <button id="btoc">목차 (O)</button>
  <button id="bprint">인쇄 · PDF</button>
  <button id="bfull">전체화면 (F)</button>
</div>
<div id="hint">← → 이동 · O 목차 · F 전체화면 · B 화면 끄기 · 체크 항목과 복사 버튼은 눌러서 씁니다</div>
<div id="black"></div>
<div id="toast"></div>
<div id="toc"><button class="close" id="btocx">닫기 (Esc)</button>
  <div class="tbar"><img id="toclogo" alt="Data Thinking Lab"><h2>두성종이 AI 업무활용 심화교육(2차)</h2></div>
  <div class="th">강의 슬라이드 목차 — 항목을 누르면 해당 슬라이드로 이동합니다 &nbsp;·&nbsp;
    단축키: <b>← →</b> 이동 · <b>O</b> 목차 · <b>F</b> 전체화면 · <b>B</b> 화면 끄기 · <b>T</b> 타이머 · <b>C</b> 체크 초기화 · <b>P</b> 인쇄</div>
  <input id="tocq" type="text" placeholder="제목으로 검색 (예: 규칙, 검산, Skill)" autocomplete="off">
  <div id="tocb"></div>
</div>

const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function promptHTML(txt,cls){
  const lines=esc(txt).split('\n').map(l=>{
    if(/^(역할|상황|목표|조건|출력|첨부|포함|사용자|필요한 행동|입력과 출력|통과 기준)\s*:/.test(l))
      return '<span class="k">'+l+'</span>';
    if(/^#\s/.test(l))            return '<span class="h">'+l+'</span>';
    if(/^\[[^\]]+\]\s*$/.test(l)) return '<span class="v">'+l+'</span>';
    return l;
  }).join('\n');
  return '<div class="pw"><button class="cp">복사</button><pre class="prompt'+(cls?' '+cls:'')+'">'+lines+'</pre></div>';
}

const TRACK=document.getElementById('track');
document.getElementById('toclogo').src=LOGO_LIGHT;

function footHTML(i,n,onDark){
  return '<div class="foot">'
    + '<div class="fl"><img src="'+(onDark?LOGO_LIGHT:LOGO_DARK)+'" alt="Data Thinking Lab">'
    + '<span><b>'+COURSE+'</b></span></div>'
    + '<div class="fr"><span class="cr">'+COPY+'</span><span class="pgno">'+(i+1)+' / '+n+'</span></div>'
    + '</div>';
}

function slideHTML(s,i,n){
  if(s.type==='cover'){
    return '<section class="slide cover"><img class="clogo" src="'+LOGO_LIGHT+'" alt="Data Thinking Lab">'
      +'<div class="cv1">'+s.eyebrow+'</div>'
      +'<h1>'+s.h+'</h1><div class="cv2">'+s.sub+'</div>'
      +'<div class="cvm">'+s.meta.map(m=>'<div><b>'+m[0]+'</b>'+m[1]+'</div>').join('')+'</div>'
      +footHTML(i,n,true)+'</section>';
  }
  if(s.type==='section'){
    return '<section class="slide section"><img class="slogo" src="'+LOGO_LIGHT+'" alt="Data Thinking Lab">'
      +'<div class="sn">'+s.no+'</div><h1>'+s.h+'</h1>'
      +'<div class="ss">'+s.sub+'</div>'
      +'<div class="sg">'+(s.tags||[]).map(t=>'<span>'+t+'</span>').join('')+'</div>'
      +footHTML(i,n,true)+'</section>';
  }
  if(s.type==='end'){
    return '<section class="slide end"><img class="clogo" src="'+LOGO_LIGHT+'" alt="Data Thinking Lab">'
      +'<h1>'+s.h+'</h1><div class="el">'+s.c+'</div>'
      +'<div class="ec">'+s.note+'</div>'+footHTML(i,n,true)+'</section>';
  }
  const kick=s.k?'<div class="kick">'+s.k+(s.tm?'<span class="tm">'+s.tm+'</span>':'')+'</div>':'';
  const head=s.h?'<h1 class="t">'+s.h+(s.sub?'<small>'+s.sub+'</small>':'')+'</h1>':'';
  const done=s.done?'<div class="done"><span class="i">'+(s.doneLabel||'✅ 완료 신호')+'</span><span>'+s.done+'</span></div>':'';
  return '<section class="slide">'+kick+head+'<div class="body"><div class="bin">'+(s.c||'')+'</div></div>'
    +done+footHTML(i,n,false)+'</section>';
}

TRACK.innerHTML=DECK.map((s,i)=>slideHTML(s,i,DECK.length)).join('');
const SL=[...TRACK.querySelectorAll('.slide')];
document.getElementById('pgt').textContent=DECK.length;

/* ☐ 표시가 든 표 칸을 눌러서 체크할 수 있게 만듭니다 */
TRACK.querySelectorAll('td').forEach(td=>{
  if(td.textContent.trim()==='☐') td.classList.add('tick');
});

/* 내용이 넘치는 슬라이드는 본문을 살짝 축소해 한 장에 맞춥니다 */
function autofit(){
  SL.forEach(s=>{
    const bd=s.querySelector('.body'); if(!bd) return;
    const bin=bd.querySelector('.bin'); if(!bin) return;
    bin.style.transform=''; bin.style.width=''; bd.classList.remove('mid');
    const was=s.classList.contains('on'); s.classList.add('on');
    const avail=bd.clientHeight;
    let k=1;
    if(bin.offsetHeight>avail+1){
      while(bin.offsetHeight*k>avail+1 && k>0.58){
        k=Math.round((k-0.025)*1000)/1000;
        bin.style.width=(100/k)+'%';
        bin.style.transform='scale('+k+')';
      }
    }else if(bin.offsetHeight<avail*0.82){
      /* 여백이 많이 남는 장은 살짝 키우고 세로 가운데로 */
      while(k<1.14){
        const nk=Math.round((k+0.02)*1000)/1000;
        bin.style.width=(100/nk)+'%';
        bin.style.transform='scale('+nk+')';
        if(bin.offsetHeight*nk>avail*0.94){ break; }
        k=nk;
      }
      bin.style.width=(100/k)+'%';
      bin.style.transform=k>1?'scale('+k+')':'';
    }
    if(!was) s.classList.remove('on');
  });
}

/* ============ 안내 토스트 ============ */
let toastT=null;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),2200);
}

/* ============ 프롬프트 복사 ============ */
function copyText(txt){
  return new Promise(resolve=>{
    if(navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext){
      navigator.clipboard.writeText(txt).then(()=>resolve(true),()=>resolve(legacy()));
    } else { resolve(legacy()); }
    function legacy(){
      try{
        const t=document.createElement('textarea');
        t.value=txt;
        t.setAttribute('readonly','');
        t.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;padding:0;border:none;opacity:0;';
        document.body.appendChild(t);
        t.focus(); t.select(); t.setSelectionRange(0,t.value.length);
        const done=document.execCommand('copy');
        document.body.removeChild(t);
        return done;
      }catch(_){ return false; }
    }
  });
}

/* 프롬프트 전체를 드래그 선택해 둡니다(복사가 막힌 환경의 마지막 수단) */
function selectNode(node){
  try{
    const r=document.createRange(); r.selectNodeContents(node);
    const s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
  }catch(_){}
}

TRACK.addEventListener('click',e=>{
  const b=e.target.closest('.cp');
  if(b){
    e.preventDefault(); e.stopPropagation();
    const pre=b.parentElement.querySelector('pre');
    copyText(pre.innerText).then(okFlag=>{
      if(okFlag){
        b.textContent='복사됨'; b.classList.add('done');
        toast('프롬프트를 복사했습니다. AI 창에 붙여넣으세요.');
        setTimeout(()=>{b.textContent='복사';b.classList.remove('done');},1600);
      }else{
        selectNode(pre);
        b.textContent='Ctrl+C';
        toast('프롬프트를 선택했습니다. Ctrl+C(Mac은 ⌘+C)를 누르세요.');
        setTimeout(()=>{b.textContent='복사';},2600);
      }
    });
    return;
  }
  /* 체크 항목 토글 */
  const li=e.target.closest('ul.chk > li');
  if(li){ e.stopPropagation(); li.classList.toggle('done'); saveMarks(); return; }
  const td=e.target.closest('td.tick');
  if(td){ e.stopPropagation(); td.classList.toggle('done');
    td.textContent=td.classList.contains('done')?'☑':'☐'; saveMarks(); return; }
});

/* 체크 상태를 이 브라우저에만 임시 저장합니다 */
const MK='dtl-doosung-deck-marks';
function saveMarks(){
  try{
    const on=[];
    document.querySelectorAll('ul.chk>li,td.tick').forEach((el,i)=>{ if(el.classList.contains('done')) on.push(i); });
    localStorage.setItem(MK,JSON.stringify(on));
  }catch(_){}
}
function loadMarks(){
  try{
    const on=JSON.parse(localStorage.getItem(MK)||'[]');
    const all=[...document.querySelectorAll('ul.chk>li,td.tick')];
    on.forEach(i=>{ const el=all[i]; if(!el) return; el.classList.add('done');
      if(el.tagName==='TD') el.textContent='☑'; });
  }catch(_){}
}
function clearMarks(){
  document.querySelectorAll('ul.chk>li.done,td.tick.done').forEach(el=>{
    el.classList.remove('done'); if(el.tagName==='TD') el.textContent='☐';
  });
  saveMarks(); toast('체크를 모두 지웠습니다.');
}

/* ============ 이동 ============ */
let cur=0;
function show(i){
  cur=Math.max(0,Math.min(DECK.length-1,i));
  SL.forEach((el,k)=>el.classList.toggle('on',k===cur));
  document.getElementById('pgn').textContent=cur+1;
  document.getElementById('bar').style.width=((cur+1)/DECK.length*100)+'%';
  try{history.replaceState(null,'','#'+(cur+1));}catch(_){}
}
function go(d){show(cur+d);}

function fit(){
  const pad=44;
  const sx=(window.innerWidth-pad)/1280, sy=(window.innerHeight-pad)/720;
  TRACK.style.transform='scale('+Math.min(sx,sy,1.35)+')';
}
window.addEventListener('resize',fit);

const BLACK=document.getElementById('black');
document.addEventListener('keydown',e=>{
  const t=document.getElementById('toc');
  if(e.key==='Escape'){ t.classList.remove('on'); BLACK.classList.remove('on'); return; }
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  if(t.classList.contains('on')) return;
  if(BLACK.classList.contains('on')){ BLACK.classList.remove('on'); return; }
  if(['ArrowRight','PageDown','ArrowDown'].includes(e.key)||e.key===' '||e.key==='Enter'){go(1);e.preventDefault();}
  else if(['ArrowLeft','PageUp','ArrowUp'].includes(e.key)||e.key==='Backspace'){go(-1);e.preventDefault();}
  else if(e.key==='Home'){show(0);}
  else if(e.key==='End'){show(DECK.length-1);}
  else if(e.key==='o'||e.key==='O'||e.key==='ㅐ'){openToc();}
  else if(e.key==='f'||e.key==='F'||e.key==='ㄹ'){toggleFull();}
  else if(e.key==='p'||e.key==='P'){window.print();}
  else if(e.key==='b'||e.key==='B'||e.key==='ㅠ'){BLACK.classList.add('on');}
  else if(e.key==='t'||e.key==='T'||e.key==='ㅅ'){toggleTimer();}
  else if(e.key==='c'||e.key==='C'||e.key==='ㅊ'){clearMarks();}
});
BLACK.addEventListener('click',()=>BLACK.classList.remove('on'));

/* 화면을 눌러도 넘어갑니다 — 단, 버튼·체크·프롬프트·표는 그대로 씁니다 */
document.getElementById('stage').addEventListener('click',e=>{
  if(e.target.closest('button, a, input, textarea, select, .pw, pre, ul.chk, td.tick')) return;
  if(window.getSelection && String(window.getSelection())) return;   /* 글자를 끌어 선택한 경우 */
  const r=TRACK.getBoundingClientRect();
  go(e.clientX < r.left + r.width*0.28 ? -1 : 1);
});

/* ============ 세션 타이머 ============ */
let tSec=0, tInt=null;
const TV=document.getElementById('tv'), TB=document.getElementById('timer'), TS=document.getElementById('tstart');
function tRender(){
  const m=String(Math.floor(tSec/60)).padStart(2,'0'), s=String(tSec%60).padStart(2,'0');
  TV.textContent=m+':'+s;
}
function toggleTimer(){
  if(tInt){ clearInterval(tInt); tInt=null; TS.textContent='시작'; TB.classList.remove('run'); }
  else { tInt=setInterval(()=>{tSec++;tRender();},1000); TS.textContent='정지'; TB.classList.add('run'); }
}
TS.onclick=toggleTimer;
document.getElementById('treset').onclick=()=>{ tSec=0; tRender(); };
function toggleFull(){
  if(!document.fullscreenElement){ (document.documentElement.requestFullscreen||function(){}).call(document.documentElement); }
  else if(document.exitFullscreen){ document.exitFullscreen(); }
}
document.getElementById('bprev').onclick=e=>{e.stopPropagation();go(-1);};
document.getElementById('bnext').onclick=e=>{e.stopPropagation();go(1);};
document.getElementById('bfull').onclick=toggleFull;
document.getElementById('bprint').onclick=()=>window.print();
function openToc(){
  const t=document.getElementById('toc');
  t.classList.add('on');
  const q=document.getElementById('tocq');
  q.value=''; filterToc(''); setTimeout(()=>q.focus(),30);
}
document.getElementById('btoc').onclick=openToc;
document.getElementById('btocx').onclick=()=>document.getElementById('toc').classList.remove('on');

let tx=0,ty=0;
document.addEventListener('touchstart',e=>{tx=e.changedTouches[0].clientX;ty=e.changedTouches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)) go(dx<0?1:-1);
},{passive:true});

/* ============ 목차 ============ */
(function(){
  const groups=[]; let g=null;
  DECK.forEach((s,i)=>{
    if(s.type==='section'||s.type==='cover'){ g={t:(s.type==='cover'?'과정 개요':s.no+'. '+s.h),items:[]}; groups.push(g); }
    if(!g){ g={t:'과정 개요',items:[]}; groups.push(g); }
    g.items.push({i:i,label:(s.h||s.sub||'—').replace(/<[^>]+>/g,'')});
  });
  document.getElementById('tocb').innerHTML=groups.map(gr=>
    '<div class="grp"><div class="gt">'+esc(gr.t)+'</div><div class="row">'
    + gr.items.map(it=>'<div class="it" data-i="'+it.i+'"><i>'+(it.i+1)+'</i>'+esc(it.label)+'</div>').join('')
    + '</div></div>').join('');
  document.getElementById('tocb').addEventListener('click',e=>{
    const it=e.target.closest('.it'); if(!it) return;
    show(+it.dataset.i); document.getElementById('toc').classList.remove('on');
  });
})();

/* 목차 검색 */
function filterToc(q){
  q=(q||'').trim().toLowerCase();
  document.querySelectorAll('#tocb .grp').forEach(gr=>{
    let hit=0;
    gr.querySelectorAll('.it').forEach(it=>{
      const on=!q || it.textContent.toLowerCase().indexOf(q)>=0;
      it.style.display=on?'':'none'; if(on) hit++;
    });
    gr.style.display=hit?'':'none';
  });
}
document.getElementById('tocq').addEventListener('input',e=>filterToc(e.target.value));
document.getElementById('tocq').addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    const first=document.querySelector('#tocb .it:not([style*="none"])');
    if(first){ show(+first.dataset.i); document.getElementById('toc').classList.remove('on'); }
  }
});

const start=parseInt((location.hash||'#1').slice(1),10);
fit(); autofit(); loadMarks(); tRender(); show(isNaN(start)?0:start-1);
window.addEventListener('beforeprint',autofit);
setTimeout(()=>document.getElementById('hint').classList.add('hide'),6500);
</script></body></html>
